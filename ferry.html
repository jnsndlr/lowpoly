<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Low Poly Washington State Ferry</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f2; font-family: system-ui, sans-serif; }
  #info {
    position: absolute; top: 12px; left: 14px; color: #14323f;
    font-size: 13px; line-height: 1.4; user-select: none; pointer-events: none;
    text-shadow: 0 1px 2px rgba(255,255,255,.5);
  }
  #info b { font-size: 15px; }
</style>
</head>
<body>
<div id="info"><b>M/V Low Poly</b> — Washington State Ferry<br>drag to orbit · scroll to zoom</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- Washington State Ferries palette ----
const WSF_WHITE  = 0xf2f4f3; // superstructure
const WSF_GREEN  = 0x115740; // trademark deep green trim
const HULL_DARK  = 0x1c1c20; // hull below the boot stripe
const DECK_GREY  = 0x8d9499; // car deck / open decks
const GLASS      = 0x2b4b53; // windows
const RED        = 0x9e2b25; // waterline boot stripe accent

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3f2);
scene.fog = new THREE.Fog(0xbfe3f2, 60, 160);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(34, 20, 38);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 3, 0);
controls.maxPolarAngle = Math.PI * 0.49; // stay above the water

// ---- Lighting ----
const sun = new THREE.DirectionalLight(0xfff6e8, 2.1);
sun.position.set(30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const d = 40;
sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
sun.shadow.camera.top = d;  sun.shadow.camera.bottom = -d;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfeaff, 0x4a6d52, 0.9));

// flat-shaded low-poly material helper
const mat = (color, opts={}) => new THREE.MeshStandardMaterial({
  color, flatShading: true, roughness: 0.85, metalness: 0.05, ...opts
});

const ferry = new THREE.Group();
scene.add(ferry);

// =========================================================
//  HULL — double-ended, tapered to a point at bow & stern
// =========================================================
const L = 30;   // half-length
const W = 6;    // half-width
const Hh = 3;   // hull height

function hull() {
  // Build an extruded, double-tapered hull as a custom geometry.
  // Cross sections from stern(-L) -> midship -> bow(+L), each a flat-bottom trapezoid.
  const sections = [
    { z:-L,      w:0.2,  yb:-Hh*0.5, yt:0.0 }, // stern point
    { z:-L+5,    w:W*0.7, yb:-Hh,     yt:0.6 },
    { z:-L+11,   w:W,     yb:-Hh,     yt:0.8 },
    { z: 0,      w:W,     yb:-Hh,     yt:0.8 }, // midship
    { z: L-11,   w:W,     yb:-Hh,     yt:0.8 },
    { z: L-5,    w:W*0.7, yb:-Hh,     yt:0.6 },
    { z: L,      w:0.2,  yb:-Hh*0.5, yt:0.0 }, // bow point
  ];

  const pos = [];
  const addQuad = (a,b,c,d) => { pos.push(...a,...b,...c, ...a,...c,...d); };

  for (let i=0;i<sections.length-1;i++){
    const s = sections[i], t = sections[i+1];
    // ring vertices: bottom-left, bottom-right, top-right, top-left
    const sBL=[-s.w,s.yb,s.z], sBR=[ s.w,s.yb,s.z], sTR=[ s.w,s.yt,s.z], sTL=[-s.w,s.yt,s.z];
    const tBL=[-t.w,t.yb,t.z], tBR=[ t.w,t.yb,t.z], tTR=[ t.w,t.yt,t.z], tTL=[-t.w,t.yt,t.z];
    addQuad(sBR,tBR,tTR,sTR);   // starboard side
    addQuad(tBL,sBL,sTL,tTL);   // port side
    addQuad(sBL,sBR,tBR,tBL);   // bottom
    addQuad(sTL,sTR,tTR,tTL);   // top (car deck floor)
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat(WSF_WHITE));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
ferry.add(hull());

// dark underbody (below waterline) — slightly smaller scaled copy dropped down
function underbody(){
  const sections = [
    {z:-L+5, w:W*0.62}, {z:0, w:W*0.9}, {z:L-5, w:W*0.62}
  ];
  const pos=[];
  const addQuad=(a,b,c,d)=>{pos.push(...a,...b,...c,...a,...c,...d);};
  for(let i=0;i<sections.length-1;i++){
    const s=sections[i],t=sections[i+1];
    const yb=-Hh-2.2, yt=-Hh+0.2;
    const sBL=[-s.w,yb,s.z],sBR=[s.w,yb,s.z],sTR=[s.w,yt,s.z],sTL=[-s.w,yt,s.z];
    const tBL=[-t.w,yb,t.z],tBR=[t.w,yb,t.z],tTR=[t.w,yt,t.z],tTL=[-t.w,yt,t.z];
    addQuad(sBR,tBR,tTR,sTR); addQuad(tBL,sBL,sTL,tTL); addQuad(sBL,sBR,tBR,tBL);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat(HULL_DARK));
  m.castShadow=true; return m;
}
ferry.add(underbody());

// red boot stripe at the waterline
const boot = new THREE.Mesh(
  new THREE.BoxGeometry(W*2+0.1, 0.5, L*2-6),
  mat(RED)
);
boot.position.y = -Hh+0.1;
ferry.add(boot);

// =========================================================
//  CAR DECK — open sides with pillars, dark interior
// =========================================================
const carDeckY = 1.2;
const carFloor = new THREE.Mesh(new THREE.BoxGeometry(W*1.9, 0.4, L*2-12), mat(DECK_GREY));
carFloor.position.y = 0.85; carFloor.receiveShadow = true;
ferry.add(carFloor);

// pillars holding up the passenger deck
const pillarGeo = new THREE.BoxGeometry(0.5, 3, 0.5);
for (let z=-L+9; z<=L-9; z+=4){
  for (const x of [-W*0.85, W*0.85]){
    const p = new THREE.Mesh(pillarGeo, mat(WSF_WHITE));
    p.position.set(x, carDeckY+1.3, z); p.castShadow = true;
    ferry.add(p);
  }
}

// a few tiny cars on the car deck for scale/charm
const carColors = [0xd64545,0x4a90d9,0xe8c33a,0x3aa856,0xdddddd];
function toyCar(x,z){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.7,3),
    mat(carColors[Math.floor(Math.random()*carColors.length)]));
  body.castShadow=true;
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.6,1.6), mat(GLASS));
  cab.position.set(0,0.55,-0.1);
  g.add(body,cab);
  g.position.set(x,1.45,z);
  return g;
}
for (let z=-L+13; z<=L-13; z+=4.5){
  ferry.add(toyCar(-2.2,z), toyCar(2.2,z));
}

// =========================================================
//  PASSENGER SUPERSTRUCTURE — white box w/ green window band
// =========================================================
const passY = 5.4;
const passLen = L*2-16;
const passW = W*1.7;

const cabin = new THREE.Mesh(new THREE.BoxGeometry(passW, 2.6, passLen), mat(WSF_WHITE));
cabin.position.y = passY; cabin.castShadow = true; cabin.receiveShadow = true;
ferry.add(cabin);

// continuous green window band (the WSF look)
const windowBand = new THREE.Mesh(new THREE.BoxGeometry(passW+0.06, 1.1, passLen-1), mat(GLASS,{roughness:0.3,metalness:0.4}));
windowBand.position.y = passY+0.2;
ferry.add(windowBand);

// green trim stripe along the deck edge
const trim = new THREE.Mesh(new THREE.BoxGeometry(passW+0.12, 0.4, passLen+0.5), mat(WSF_GREEN));
trim.position.y = passY-1.45;
ferry.add(trim);

// open promenade rail decks at both ends (green)
function promenade(zsign){
  const g = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.BoxGeometry(passW, 0.3, 5), mat(DECK_GREY));
  floor.position.set(0, passY-1.3, zsign*(passLen/2+2.5));
  const railing = new THREE.Mesh(new THREE.BoxGeometry(passW, 1, 0.2), mat(WSF_GREEN));
  railing.position.set(0, passY-0.8, zsign*(passLen/2+5));
  g.add(floor, railing);
  return g;
}
ferry.add(promenade(1), promenade(-1));

// =========================================================
//  SUN DECK + TWIN PILOT HOUSES (double-ended boat)
// =========================================================
const sunDeck = new THREE.Mesh(new THREE.BoxGeometry(passW*0.82, 2.0, passLen*0.66), mat(WSF_WHITE));
sunDeck.position.y = passY+2.3; sunDeck.castShadow=true; sunDeck.receiveShadow=true;
ferry.add(sunDeck);

const sunBand = new THREE.Mesh(new THREE.BoxGeometry(passW*0.82+0.06, 0.8, passLen*0.66-1), mat(GLASS,{roughness:0.3,metalness:0.4}));
sunBand.position.y = passY+2.5;
ferry.add(sunBand);

function pilotHouse(zsign){
  const g = new THREE.Group();
  const z = zsign*(passLen*0.66/2 - 0.5);
  // tapered wheelhouse
  const house = new THREE.Mesh(new THREE.BoxGeometry(passW*0.6, 1.8, 3.2), mat(WSF_WHITE));
  house.position.set(0, passY+4.2, z); house.castShadow=true;
  const wrap = new THREE.Mesh(new THREE.BoxGeometry(passW*0.6+0.06, 1.0, 3.0), mat(GLASS,{roughness:0.2,metalness:0.5}));
  wrap.position.set(0, passY+4.4, z);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(passW*0.6, 0.25, 3.4), mat(WSF_GREEN));
  roof.position.set(0, passY+5.2, z);
  // mast
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,2.4,6), mat(0xcccccc));
  mast.position.set(0, passY+6.4, z);
  g.add(house, wrap, roof, mast);
  return g;
}
ferry.add(pilotHouse(1), pilotHouse(-1));

// central smokestack with green band
const stack = new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.2,3.2,8), mat(WSF_WHITE));
stack.position.y = passY+4.0; stack.castShadow=true;
const stackBand = new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,0.9,8), mat(WSF_GREEN));
stackBand.position.y = passY+5.0;
ferry.add(stack, stackBand);

// =========================================================
//  WATER
// =========================================================
const waterGeo = new THREE.PlaneGeometry(400, 400, 40, 40);
// gentle wave displacement for low-poly water
const wp = waterGeo.attributes.position;
for (let i=0;i<wp.count;i++){
  wp.setZ(i, Math.sin(wp.getX(i)*0.3)*Math.cos(wp.getY(i)*0.3)*0.4);
}
waterGeo.computeVertexNormals();
const water = new THREE.Mesh(waterGeo, mat(0x2e8bbf,{transparent:true,opacity:0.92,roughness:0.4}));
water.rotation.x = -Math.PI/2;
water.position.y = -2.6;
water.receiveShadow = true;
scene.add(water);

// =========================================================
//  ANIMATE — gentle bob + sway
// =========================================================
let t = 0;
function animate(){
  requestAnimationFrame(animate);
  t += 0.01;
  ferry.position.y = Math.sin(t)*0.3;
  ferry.rotation.z = Math.sin(t*0.7)*0.012;
  ferry.rotation.x = Math.cos(t*0.5)*0.008;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
